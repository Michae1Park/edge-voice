<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="790" viewBox="0 0 1180 790" role="img" aria-labelledby="svgtitle svgdesc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="svgtitle">edge-voice architecture</title>
  <desc id="svgdesc">Third-party audio sources publish per-channel PCM to an MQTT broker. Everything else runs inside one edge-voice Python process: MqttAudioIngest, ChannelRouter, VADWorker and STTWorker are worker threads joined by bounded queues, ending at TranscriptHub; alongside them the orchestrator, supervisor and metrics collector, the logging handlers, and a FastAPI/uvicorn web server on the main thread, which pushes transcripts to a browser over a WebSocket.</desc>

  <!--
    Light theme lives in inline presentation attributes, NOT in the stylesheet
    below: if a host (GitHub sanitizes SVG in markdown) drops the style
    element, presentation attributes survive and the diagram still renders
    correctly in light colours. The stylesheet carries only the dark-mode
    override, so losing it degrades to "always light" rather than to unstyled
    black boxes. CSS beats presentation attributes on specificity, so the
    override wins wherever the stylesheet is honoured.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0f1419; stroke: #2b3540; }
      .panel { fill: #151c24; stroke: #3a4753; }
      .ext   { fill: #16283c; stroke: #6f9dc8; }
      .work  { fill: #16301f; stroke: #63ab77; }
      .queue { fill: #33280f; stroke: #d3a751; }
      .sink  { fill: #241b33; stroke: #a186c4; }
      .ops   { fill: #331a1a; stroke: #c88080; }
      .name  { fill: #e6edf3; }
      .sub   { fill: #9fb0c0; }
      .qname { fill: #f3e6c8; }
      .qsub  { fill: #cdb583; }
      .ptitle{ fill: #93a4b4; }
      .edge  { stroke: #8496a6; }
      .elabel{ fill: #93a4b4; }
      .edge-d{ stroke: #c88080; }
      .lg    { fill: #9fb0c0; }
      #arrow > path   { fill: #8496a6; }
      #arrow-d > path { fill: #c88080; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7a"/>
    </marker>
    <marker id="arrow-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a85f5f"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1179" height="789" rx="10" fill="#ffffff" stroke="#e3e9ef"/>

  <!-- ══════ the process boundary: everything but the sources and the broker ══════ -->
  <rect class="panel" x="400" y="30" width="750" height="730" rx="10" fill="#f7f9fb" stroke="#c7d3de" stroke-width="1.5"/>
  <text class="ptitle" x="775" y="56" text-anchor="middle" font-size="14.5" font-weight="600" fill="#46586a">edge-voice process — one Python process</text>

  <!-- ── pipeline column: worker threads and the queues between them ── -->
  <rect class="work" x="420" y="90" width="300" height="58" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="570" y="113" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">MqttAudioIngest</text>
  <text class="sub" x="570" y="134" text-anchor="middle" font-size="14" fill="#4a5a68">MQTT subscribe · decode PCM</text>

  <rect class="queue" x="460" y="170" width="220" height="44" rx="7" fill="#fbf1de" stroke="#bf8f33" stroke-width="1.5"/>
  <text class="qname" x="570" y="190" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2109">ingest_queue</text>
  <text class="qsub" x="570" y="207" text-anchor="middle" font-size="13.5" fill="#6b5a2e">maxsize 256</text>

  <rect class="work" x="420" y="236" width="300" height="58" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="570" y="259" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">ChannelRouter</text>
  <text class="sub" x="570" y="280" text-anchor="middle" font-size="14" fill="#4a5a68">repacketize 20ms → 32ms</text>

  <rect class="queue" x="460" y="316" width="220" height="44" rx="7" fill="#fbf1de" stroke="#bf8f33" stroke-width="1.5"/>
  <text class="qname" x="570" y="336" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2109">routed_queue</text>
  <text class="qsub" x="570" y="353" text-anchor="middle" font-size="13.5" fill="#6b5a2e">maxsize 128</text>

  <rect class="work" x="420" y="382" width="300" height="58" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="570" y="405" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">VADWorker</text>
  <text class="sub" x="570" y="426" text-anchor="middle" font-size="14" fill="#4a5a68">Silero · per-channel state</text>

  <rect class="queue" x="460" y="462" width="220" height="44" rx="7" fill="#fbf1de" stroke="#bf8f33" stroke-width="1.5"/>
  <text class="qname" x="570" y="482" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2109">segment_queue</text>
  <text class="qsub" x="570" y="499" text-anchor="middle" font-size="13.5" fill="#6b5a2e">maxsize 64</text>

  <rect class="work" x="420" y="528" width="300" height="58" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="570" y="551" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">STTWorker</text>
  <text class="sub" x="570" y="572" text-anchor="middle" font-size="14" fill="#4a5a68">Moonshine · per-segment pass</text>

  <rect class="work" x="420" y="608" width="300" height="58" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="570" y="631" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">TranscriptHub</text>
  <text class="sub" x="570" y="652" text-anchor="middle" font-size="14" fill="#4a5a68">fan-out to live subscribers</text>

  <path class="edge" d="M 570 148 V 164" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 570 214 V 230" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 570 294 V 310" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 570 360 V 376" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 570 440 V 456" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 570 506 V 522" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 570 586 V 602" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="elabel" x="580" y="599" font-size="13" fill="#46586a">TranscriptEvent</text>

  <!-- ── support column: same process, not on the audio path ── -->
  <rect class="ops" x="800" y="90" width="320" height="116" rx="7" fill="#f7eaea" stroke="#a85f5f" stroke-width="1.5"/>
  <text class="name" x="960" y="116" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">Orchestrator · Supervisor</text>
  <text class="name" x="960" y="137" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">MetricsCollector</text>
  <text class="sub" x="960" y="161" text-anchor="middle" font-size="14" fill="#4a5a68">build/start/stop · restart wedged workers</text>
  <text class="sub" x="960" y="180" text-anchor="middle" font-size="14" fill="#4a5a68">queue depths · stage latencies · watchdog</text>
  <text class="sub" x="960" y="198" text-anchor="middle" font-size="14" fill="#4a5a68">health snapshots</text>

  <rect class="sink" x="800" y="222" width="320" height="58" rx="7" fill="#f0eaf7" stroke="#7c62a0" stroke-width="1.5"/>
  <text class="name" x="960" y="245" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">Logging handlers</text>
  <text class="sub" x="960" y="266" text-anchor="middle" font-size="14" fill="#4a5a68">every component → journald + file</text>

  <rect class="queue" x="855" y="615" width="210" height="44" rx="7" fill="#fbf1de" stroke="#bf8f33" stroke-width="1.5"/>
  <text class="qname" x="960" y="635" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2109">subscriber queue</text>
  <text class="qsub" x="960" y="652" text-anchor="middle" font-size="13.5" fill="#6b5a2e">maxsize 200 · one per client</text>

  <rect class="sink" x="800" y="690" width="320" height="58" rx="7" fill="#f0eaf7" stroke="#7c62a0" stroke-width="1.5"/>
  <text class="name" x="960" y="713" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">Web UI server</text>
  <text class="sub" x="960" y="734" text-anchor="middle" font-size="14" fill="#4a5a68">FastAPI + uvicorn · main thread</text>

  <!-- TranscriptHub -> web server, through a queue.Queue registered per browser -->
  <path class="edge" d="M 720 637 H 849" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 960 659 V 684" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Supervision spine: exactly the four SupervisedTargets in
       orchestrator._build_supervisor_targets(). It deliberately stops above
       TranscriptHub, which is not a thread and so is not supervised. -->
  <path class="edge-d" d="M 800 119 H 726" fill="none" stroke="#a85f5f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-d)"/>
  <path class="edge-d" d="M 752 119 V 545" fill="none" stroke="#a85f5f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path class="edge-d" d="M 752 265 H 726" fill="none" stroke="#a85f5f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-d)"/>
  <path class="edge-d" d="M 752 411 H 726" fill="none" stroke="#a85f5f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-d)"/>
  <path class="edge-d" d="M 752 545 H 726" fill="none" stroke="#a85f5f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-d)"/>

  <!-- ══════ outside the process: only these are third-party ══════ -->
  <rect class="ext" x="30" y="80" width="320" height="76" rx="7" fill="#e6eef8" stroke="#4a7bab" stroke-width="1.5"/>
  <text class="name" x="190" y="110" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">Audio sources</text>
  <text class="sub" x="190" y="132" text-anchor="middle" font-size="14" fill="#4a5a68">any MQTT publisher — live feed,</text>
  <text class="sub" x="190" y="149" text-anchor="middle" font-size="14" fill="#4a5a68">wav_source.py, mic_source.py</text>

  <rect class="ext" x="30" y="200" width="320" height="76" rx="30" fill="#e6eef8" stroke="#4a7bab" stroke-width="1.5"/>
  <text class="name" x="190" y="226" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">MQTT broker</text>
  <text class="sub" x="190" y="247" text-anchor="middle" font-size="14" fill="#4a5a68">mosquitto — on the edge device</text>
  <text class="sub" x="190" y="264" text-anchor="middle" font-size="14" fill="#4a5a68">or anywhere on the network</text>

  <rect class="ext" x="30" y="685" width="320" height="68" rx="7" fill="#e6eef8" stroke="#4a7bab" stroke-width="1.5"/>
  <text class="name" x="190" y="713" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">Browser</text>
  <text class="sub" x="190" y="734" text-anchor="middle" font-size="14" fill="#4a5a68">WebSocket · 127.0.0.1:8080</text>

  <path class="edge" d="M 190 156 V 194" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="elabel" x="202" y="180" font-size="13" fill="#46586a">PCM per channel</text>

  <path class="edge" d="M 350 238 H 375 Q 390 238 390 223 V 134 Q 390 119 405 119 H 414" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- web server out to the browser, along the clear corridor below the chain -->
  <path class="edge" d="M 794 719 H 356" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="elabel" x="575" y="711" text-anchor="middle" font-size="12" fill="#46586a">WebSocket push</text>

  <!-- ══════ legend ══════ -->
  <text class="ptitle" x="30" y="380" font-size="13.5" font-weight="600" fill="#46586a">LEGEND</text>
  <rect class="work" x="32" y="400" width="18" height="18" rx="4" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="lg" x="62" y="414" font-size="14" fill="#4a5a68">worker thread</text>
  <rect class="queue" x="32" y="432" width="18" height="18" rx="4" fill="#fbf1de" stroke="#bf8f33" stroke-width="1.5"/>
  <text class="lg" x="62" y="446" font-size="14" fill="#4a5a68">bounded queue.Queue</text>
  <rect class="sink" x="32" y="464" width="18" height="18" rx="4" fill="#f0eaf7" stroke="#7c62a0" stroke-width="1.5"/>
  <text class="lg" x="62" y="478" font-size="14" fill="#4a5a68">output surface, same process</text>
  <rect class="ops" x="32" y="496" width="18" height="18" rx="4" fill="#f7eaea" stroke="#a85f5f" stroke-width="1.5"/>
  <text class="lg" x="62" y="510" font-size="14" fill="#4a5a68">supervision + metrics</text>
  <rect class="ext" x="32" y="528" width="18" height="18" rx="4" fill="#e6eef8" stroke="#4a7bab" stroke-width="1.5"/>
  <text class="lg" x="62" y="542" font-size="14" fill="#4a5a68">outside the process</text>
</svg>
