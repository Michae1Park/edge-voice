# Default configuration for edge-voice.
# Override per-deployment via config/local.yaml (gitignored) or
# EDGE_VOICE__SECTION__FIELD environment variables.

mqtt:
  broker_host: "localhost"
  broker_port: 1883
  channels:
    - topic: "stt/audio_chunks_rx"
      channel_id: "rx"
    - topic: "stt/audio_chunks_tx"
      channel_id: "tx"

audio:
  sample_rate: 16000
  channels: 1
  format: "int16"

dump:
  enabled: false
  output_dir: "./dumped_audio"
  segment_secs: 10

segment_dump:
  enabled: false
  output_dir: "./dumped_vad_segments"

queues:
  ingest: 256
  routed: 128
  segment: 64
  dump: 256

repacketizer:
  incoming_ms: 20.0     # frame size arriving from ingest
  outgoing_ms: 32.0     # frame size handed to VAD (must match vad.window_samples)
  bytes_per_sample: 2   # 16-bit PCM mono

vad:
  threshold: 0.5
  window_samples: 512        # 32ms @ 16kHz
  rms_gate_enabled: true
  silence_rms_floor: 0.01    # CALIBRATE: normalized float32 RMS, not raw int16
  preroll_chunks: 3
  min_silence_duration_ms: 100  # silence required before Silero fires `end` (raise if tail-clipping)
  speech_pad_ms: 0             # padding Silero appends around detected speech
  # Emit an in-progress segment after this many seconds with no packets; 0 disables.
  idle_flush_s: 2.0
  # Bounds segments with no pause long enough for Silero to fire `end`. Load-bearing on the RPi5:
  # uncapped, decode cost grows superlinearly and queues eventually drop live audio.
  segment_limits_enabled: true
  # Off: a soft cut backdates `end` to the pause and delays the tail (~0.7-1.75s per piece on the
  # RPi5 vs ~17ms uncut, see docs/BENCHMARK.md). The hard cap alone bounds backlog.
  soft_cut_enabled: false
  soft_cut_s: 3.0            # past this, look for a natural pause to cut at
  soft_cut_lookahead_s: 1.0  # how far back to scan for that pause
  soft_cut_min_dip: 0.10     # dip must be this far below the current score
  # Revisable in-progress transcripts; 0 disables. Each partial re-transcribes the whole prefix.
  # Measured on a Ryzen 7 with ko-tiny (gain = first partial ahead of final; cost = inference vs none):
  #
  #   seg   min/iv    partials   gain    cost
  #   2.0s  1.5/1.5      1       0.60s   2.0x
  #   2.0s  1.0/1.0      1       1.12s   1.8x
  #   3.0s  1.5/1.5      2       1.61s   3.0x
  #   3.0s  1.0/1.0      2       2.15s   2.5x
  #
  # Re-measure on the target device; watch STTWorker.partial_stats() dropped:transcribed.
  partial_interval_s: 0.0
  partial_min_segment_s: 1.0  # skip partials on turns shorter than this
  max_segment_s: 5.0         # hard cap if no suitable pause is found

stt:
  # Which model, on which hardware. Independent axes:
  #   model:   sensevoice | moonshine
  #   runtime: auto | npu | cpu
  # SenseVoice runs on cpu or npu (RK3588); Moonshine is cpu only. "auto" uses
  # the NPU when present, otherwise the CPU. A requested NPU that can't be
  # used falls back to the same model on CPU, with the reason logged.
  model: "sensevoice"
  runtime: "auto"
  # sensevoice: auto | zh | en | ja | ko | yue
  # moonshine:  ar | en | es | ja | ko | uk | vi | zh (see stt.moonshine below)
  language: "ko"

  sensevoice:
    use_itn: true              # inverse text normalization (numbers, punctuation)
    # Models download here on first start: int8 ONNX (~160 MB) for cpu, the
    # RK3588 RKNN build (~420 MB) for npu. *_model_dir overrides skip it.
    cache_dir: "~/.cache/edge_voice/sensevoice"
    cpu_model_dir: ""
    cpu_threads: 1             # per channel; channels already run in parallel
    npu_model_dir: ""
    # The RKNN build's fixed input window: 5 | 10 | 15 | 20 | 25 | 30. Every
    # call costs a full window, and longer segments are split into windows,
    # so match it to vad.max_segment_s.
    npu_window_s: 5
    npu_runtime_lib: ""        # absolute path to librknnrt.so; "" = system lib
    # One channel per NPU core (RK3588: 3). With runtime "npu", more
    # mqtt.channels than this fails at startup; with "auto", the extra
    # channels run on CPU. Two streams per core doubled tail latency.
    npu_max_channels: 3
    npu_probe_timeout_s: 60

  moonshine:
    # model_arch: tiny | base | tiny-streaming | small-streaming | medium-streaming
    # en publishes every arch; es publishes "base" only; every other language
    # publishes "tiny" and "base". An unavailable combination fails at startup
    # listing what that language does have.
    # ko/base and ar|uk|vi|zh tiny work only via _MODEL_REGISTRY_OVERRIDES in stt_worker.py.
    # Re-check with scratch/probe_moonshine_models.py after upgrading moonshine.
    model_arch: "tiny"
    # Too low truncates: Korean at 13.0 cut ~20% of each segment's tail. Output saturates at ~20.
    # Must be set -- omitting it truncates worse than any explicit value.
    max_tokens_per_second: "18.0"
    vad_threshold: "0"          # keeps the stt model's internal vad off
    identify_speakers: false
    log_api_calls: false
    save_input_wav_path: ""
    return_audio_data: false

  # Skip a partial when the segment queue is at least this deep. Finals are never dropped.
  partial_max_queue_depth: 0

webui:
  host: "127.0.0.1"  # no network on target device; kiosk browser is local-only
  port: 8080
  transcript_backlog: 50

reliability:
  # Supervision restarts crashed/wedged workers; the systemd watchdog restarts a hung process.
  enabled: true
  tick_interval_s: 2.0     # supervisor scan + watchdog ping cadence; keep << WatchdogSec
  stall_timeout_s: 10.0    # alive + input backed up + no progress this long => wedged, restart
  max_restarts: 3          # more than this many restarts of one worker...
  restart_window_s: 60.0   # ...within this window flips it to "degraded" (stop hot-restarting)
  watchdog_enabled: true   # sd_notify pings; a no-op unless launched by systemd (NOTIFY_SOCKET set)

logging:
  enabled: true           # master switch -- false disables ALL logging process-wide (perf)
  console_enabled: false   # write to console/stderr (captured by journald under systemd)
  file_enabled: true      # also write to a rotating file in output_dir, independent of console
  level: "INFO"           # minimum level emitted; --debug on the CLI overrides this to DEBUG
  json: true              # console format: structured JSON, or false for pretty text (dev only)
  output_dir: "./logs"    # rotating log file lives here; auto-created; only used if file_enabled
  max_bytes: 10000000     # ~10MB per log file before rotating to a new one
  backup_count: 5         # how many rotated (old) log files to keep before deleting the oldest

metrics:
  enabled: true
  emit_interval_s: 10.0
  # Log line only; sub-ms router/VAD readings show as 0.0. The snapshot keeps full precision.
  latency_log_decimals: 3

health:
  # Seconds without inbound packets before a channel is flagged stale (per-channel only).
  stale_segment_warning_s: 30
