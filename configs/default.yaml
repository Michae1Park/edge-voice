# Default configuration for edge-voice.
# Override per-deployment via config/local.yaml (gitignored) or
# EDGE_VOICE__SECTION__FIELD environment variables.

mqtt:
  broker_host: "localhost"
  broker_port: 1883
  channels:
    - topic: "stt/audio_chunks_rx"
      channel_id: "rx"
    - topic: "stt/audio_chunks_tx"
      channel_id: "tx"

audio:
  sample_rate: 16000
  channels: 1
  format: "int16"

dump:
  enabled: false
  output_dir: "./dumped_audio"
  segment_secs: 10

segment_dump:
  enabled: false
  output_dir: "./dumped_vad_segments"

queues:
  ingest: 256
  routed: 128
  segment: 64
  dump: 256

repacketizer:
  incoming_ms: 20.0     # frame size arriving from ingest
  outgoing_ms: 32.0     # frame size handed to VAD (must match vad.window_samples)
  bytes_per_sample: 2   # 16-bit PCM mono

vad:
  threshold: 0.5
  window_samples: 512        # 32ms @ 16kHz
  rms_gate_enabled: true
  silence_rms_floor: 0.01    # CALIBRATE: normalized float32 RMS, not raw int16
  preroll_chunks: 3
  min_silence_duration_ms: 100  # silence required before Silero fires `end` (raise if tail-clipping)
  speech_pad_ms: 0             # padding Silero appends around detected speech
  # Emit an in-progress segment after this many seconds of NO packets on a
  # channel. Every other boundary rule needs packets to keep arriving, so
  # without this the final utterance of a stream waits until shutdown.
  # Raise it if network jitter can stall a channel mid-speech; 0 disables.
  idle_flush_s: 2.0
  # Segment-length limits, for outlier cases only: speech that runs on with
  # no pause long enough for Silero to fire `end`. Such a run otherwise
  # buffers unbounded and the pipeline emits nothing until the speaker
  # stops, so this bounds emission latency as much as segment length.
  # Ordinary turn-taking never reaches soft_cut_s and pays nothing.
  segment_limits_enabled: false
  soft_cut_s: 2.0            # past this, look for a natural pause to cut at
  soft_cut_lookahead_s: 1.0  # how far back to scan for that pause
  soft_cut_min_dip: 0.10     # dip must be this far below the current score
  # Revisable transcripts of the in-progress segment, so the UI shows text
  # before the speaker stops. 0 disables (as with idle_flush_s). ko has no
  # streaming model, so every partial re-transcribes the whole prefix from
  # scratch -- this costs real inference and the multiplier grows with
  # prefix length. Partials are dropped under backlog
  # (stt.partial_max_queue_depth), never dumped, and never counted in STT
  # latency metrics.
  #
  # Tuned for call turns, which are typically under 3s. At that length
  # partial_min_segment_s is the knob that matters: first text lands at
  # roughly min + its own inference cost, and there's little room left for
  # refreshes, so the first appearance is nearly the whole benefit.
  # Measured on a Ryzen 7 with ko-tiny (gain = how much earlier the first
  # partial beats the final; cost = total inference vs no partials):
  #
  #   seg   min/iv    partials   gain    cost
  #   2.0s  1.5/1.5      1       0.60s   2.0x
  #   2.0s  1.0/1.0      1       1.12s   1.8x
  #   3.0s  1.5/1.5      2       1.61s   3.0x
  #   3.0s  1.0/1.0      2       2.15s   2.5x
  #
  # 1.0/1.0 beats 1.5/1.5 on gain at every length and is cheaper at most,
  # since a 1.0s prefix costs less to transcribe than a 1.5s one. Going
  # finer buys almost nothing: 1.0/0.75 moves first text by 0.01s for 3.8x.
  # Re-measure on the Pi before changing these -- watch the dropped:
  # transcribed ratio from STTWorker.partial_stats().
  partial_interval_s: 1.0
  partial_min_segment_s: 1.0  # skip partials on turns shorter than this
  max_segment_s: 3.0         # hard cap if no suitable pause is found

stt:
  # language + model_arch select the model together.
  #   language:   ar | en | es | ja | ko | uk | vi | zh
  #   model_arch: tiny | base | tiny-streaming | small-streaming | medium-streaming
  # en publishes every arch; es publishes "base" only; every other language
  # publishes "tiny" and "base". An unavailable combination fails at startup
  # listing what that language does have.
  # Five combinations ship on moonshine's CDN without a registry row pointing
  # at them, and work only through _MODEL_REGISTRY_OVERRIDES in stt_worker.py:
  # ko/base, plus ar|uk|vi|zh + tiny. 
  # Re-check with scratch/probe_moonshine_models.py after upgrading moonshine.
  language: "ko"
  model_arch: "tiny"
  # Decoder token budget. Too low truncates mid-sentence: Korean at 13.0
  # cut ~20% of every segment's tail ("무엇을 도?" for "무엇을 도와드릴까요?").
  # Output saturates at ~20 with no latency cost and no repetition up to 75;
  # 30 leaves headroom for fast speakers. Must be set -- omitting the option
  # entirely truncates worse than any explicit value.
  max_tokens_per_second: "18.0"
  vad_threshold: "0"          # keeps the stt model's internal vad off 
  identify_speakers: false
  log_api_calls: false
  save_input_wav_path: ""
  return_audio_data: false
  # Backpressure guard for vad.partial_interval_s: skip a partial when the
  # segment queue is this deep or deeper. 0 = drop whenever any real work is
  # already waiting. Finals are never dropped.
  partial_max_queue_depth: 0

webui:
  host: "127.0.0.1"  # no network on target device; kiosk browser is local-only
  port: 8080
  transcript_backlog: 50

reliability:
  # In-process worker supervision + OS-level watchdog. See docs/BUILDPLAN.md
  # Milestone 6. The two layers catch different failures: supervision restarts
  # a thread that crashes or wedges; the watchdog lets systemd restart the
  # whole process when it hangs (which supervision, wedged alongside it, can't).
  enabled: true
  tick_interval_s: 2.0     # supervisor scan + watchdog ping cadence; keep << WatchdogSec
  stall_timeout_s: 10.0    # alive + input backed up + no progress this long => wedged, restart
  max_restarts: 3          # more than this many restarts of one worker...
  restart_window_s: 60.0   # ...within this window flips it to "degraded" (stop hot-restarting)
  watchdog_enabled: true   # sd_notify pings; a no-op unless launched by systemd (NOTIFY_SOCKET set)

logging:
  enabled: true           # master switch -- false disables ALL logging process-wide (perf)
  console_enabled: false   # write to console/stderr (captured by journald under systemd)
  file_enabled: true      # also write to a rotating file in output_dir, independent of console
  level: "INFO"           # minimum level emitted; --debug on the CLI overrides this to DEBUG
  json: true              # console format: structured JSON, or false for pretty text (dev only)
  output_dir: "./logs"    # rotating log file lives here; auto-created; only used if file_enabled
  max_bytes: 10000000     # ~10MB per log file before rotating to a new one
  backup_count: 5         # how many rotated (old) log files to keep before deleting the oldest

metrics:
  # Milestone 7: periodic aggregation of queue depths, STT latency, restart
  # budget, and MQTT connectivity into one structured log line + in-memory
  # snapshot for health/reporting.py to read later.
  enabled: true
  emit_interval_s: 10.0
  # Decimal places the per-channel latency dicts (vad_silero, vad_rms_gate,
  # router_repacketize, stt_channel) are rounded to in the log line -- full
  # precision is always kept in the in-memory snapshot regardless. Router/VAD
  # readings are often sub-millisecond, so they'll show as 0.0 at the default.
  latency_log_decimals: 3

health:
  # Flag a channel stale in /api/status if no audio packet has arrived on it
  # for this long. Measured by ChannelRouter's wall clock (inbound packets),
  # NOT segment finalization -- the field name predates that decision (see
  # docs/BUILDPLAN.md Milestone 7). Per-channel only: a stale channel never
  # turns the kiosk's overall status amber, since between calls every channel
  # is legitimately stale.
  stale_segment_warning_s: 30

