<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Edge Voice — Live Session</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2310151d'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23b8965a'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/console.css" />
</head>
<body>

<div class="console">
  <header class="bar">
    <div class="ident">
      <span class="wordmark">Edge Voice</span>
      <span class="rule"></span>
      <span class="sub">rpi5 · local session · no network</span>
    </div>
    <div class="right">
      <span class="clock" id="clock">--:--:--</span>
      <span class="status stopped" id="livePill"><span class="dot"></span><span id="liveLabel">connecting</span></span>
      <button class="link-btn" id="clearBtn" type="button" title="Clear transcript history">Clear</button>
    </div>
  </header>

  <div class="strip">
    <span class="cell" id="chipMqtt"><span class="sc">MQTT</span><span class="v" id="mqttVal">&mdash;</span></span>
    <span class="cell" id="chipQueues"><span class="sc">Queues</span><span class="v" id="queueVal">&mdash;</span></span>
    <span id="channelChips"></span>
    <span class="cell" id="chipMetrics"><span class="sc">Metrics</span><span class="v" id="metricsVal">&mdash;</span></span>
  </div>

  <div class="modrow">
    <span id="modules"></span>
  </div>

  <!-- Legend note: channel identity in the feed below rests on the RX/TX
       badge letters and row-reverse layout, not on colour -- see
       console.css's .row comment. This legend only keys the module dots. -->
  <div class="legend-bar" role="note" aria-label="Legend -- static reference, not live data">
    <span class="legend-tag">Legend</span>
    <span class="legend"><span class="dot" style="background:var(--good)"></span>running</span>
    <span class="legend"><span class="dot" style="background:var(--warn)"></span>degraded / restarting</span>
    <span class="legend"><span class="dot" style="background:var(--stopped)"></span>stopped / unavailable</span>
  </div>

  <main class="feed" id="feed">
    <div class="feed-inner" id="feedInner">
      <div class="empty" id="empty">No transcripts yet — waiting for speech</div>
    </div>
  </main>

  <button class="jump" id="jumpBtn" type="button" hidden>New lines below</button>
</div>

<script src="/static/console.js"></script>

</body>
</html>
