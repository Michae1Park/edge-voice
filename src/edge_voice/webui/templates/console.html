<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Edge Voice — Live Session</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='5' fill='%230b0e17'/%3E%3Ccircle cx='8' cy='8' r='3.4' fill='%238b5cf6'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/console.css" />
</head>
<body>

<div class="console">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">EV</span>
      <div class="brand-text">
        <span class="brand-name">Edge Voice</span>
      </div>
    </div>

    <div class="side-top">
      <span class="clock" id="clock">--:--:--</span>
      <span class="status stopped" id="livePill"><span class="dot"></span><span id="liveLabel">connecting</span></span>
    </div>

    <div class="side-section">
      <div class="side-label">System</div>
      <div class="stat-row" id="chipMqtt"><span class="stat-name">MQTT</span><span class="stat-val" id="mqttVal">&mdash;</span></div>
      <div class="stat-block" id="chipQueues">
        <span class="stat-name">Queues</span>
        <div class="stat-lines" id="queueVal"></div>
      </div>
      <div class="stat-row" id="chipMetrics"><span class="stat-name">Metrics</span><span class="stat-val" id="metricsVal">&mdash;</span></div>
    </div>

    <div class="side-section">
      <div class="side-label">Channels</div>
      <div class="side-list" id="channelChips"></div>
    </div>

    <div class="side-section grow">
      <div class="side-label">Pipeline</div>
      <div class="side-list" id="modules"></div>
    </div>

    <!-- Legend note: channel identity in the feed rests on the avatar
         letters and message alignment, not on colour -- this legend only
         keys the pipeline status indicators above. -->
    <div class="side-footer">
      <div class="legend" role="note" aria-label="Legend -- static reference, not live data">
        <span class="legend-item"><span class="dot" style="background:var(--good)"></span>running</span>
        <span class="legend-item"><span class="dot" style="background:var(--warn)"></span>degraded</span>
        <span class="legend-item"><span class="dot" style="background:var(--stopped)"></span>stopped</span>
      </div>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <div class="chat-ident">
        <span class="chat-title">Live Transcript</span>
      </div>
      <button class="link-btn" id="clearBtn" type="button" title="Clear transcript history">Clear transcript</button>
    </header>

    <div class="feed" id="feed">
      <div class="feed-inner" id="feedInner">
        <div class="empty" id="empty">No transcripts yet — waiting for speech</div>
      </div>
    </div>

    <button class="jump" id="jumpBtn" type="button" hidden>&#8595; New lines</button>
  </main>
</div>

<script src="/static/console.js"></script>

</body>
</html>
