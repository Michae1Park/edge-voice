<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Edge Voice — Live Session</title>
<style>
  :root {
    --bg: #0b0d10;
    --surface: #15181d;
    --surface-2: #1b1f26;
    --line: #262b33;
    --line-soft: #1d2129;
    --ink: #eceef1;
    --ink-dim: #8890a0;
    --ink-faint: #4d5462;
    --tx: #ffb454;
    --tx-dim: rgba(255, 180, 84, 0.15);
    --rx: #4dd8c4;
    --rx-dim: rgba(77, 216, 196, 0.15);
    --live: #4ade80;
    --stopped: #6b7280;
    --degraded: #f5a623;
    --radius: 5px;
    --mono: "Berkeley Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace,
      "SF Mono", "Cascadia Code", Consolas, monospace;
  }

  html, body {
    height: 100%;
    background: var(--bg);
  }

  body {
    margin: 0;
    font-family: var(--mono);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  ::selection {
    background: var(--tx-dim);
    color: var(--ink);
  }

  .console {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .console::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(255, 255, 255, 0.028) 0px,
      rgba(255, 255, 255, 0.028) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity: 0.35;
  }

  /* ── header ─────────────────────────────────────────── */

  .bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 24px;
    height: 60px;
    padding: 0 20px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
    z-index: 2;
  }

  .ident {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }

  .ident-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--ink);
  }

  .ident-sub {
    font-size: 12px;
    color: var(--ink-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .legend-group {
    display: flex;
    gap: 16px;
    margin-left: auto;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .right {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .clock {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
  }

  .live-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--live);
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: var(--radius);
    padding: 5px 10px 5px 8px;
    transition: color 0.2s ease;
  }
  .live-pill.stopped { color: var(--stopped); }
  /* Pipeline running, but something is wrong -- either the supervisor has
     flagged a worker degraded (crash-looping past its restart budget) or the
     MQTT broker is unreachable. Distinct from stopped: work may still be
     flowing, so it's a warning, not an off. Driven by /api/status's
     top-level `status` field ("warn"), not by `degraded` alone.
     Channel staleness deliberately does NOT land here -- see health/reporting.py. */
  .live-pill.degraded { color: var(--degraded); }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .dot.rx { background: var(--rx); }
  .dot.tx { background: var(--tx); }
  .dot.live { background: var(--live); }
  .live-pill.stopped .dot.live { background: var(--stopped); }
  .live-pill.degraded .dot.live { background: var(--degraded); }

  @media (prefers-reduced-motion: no-preference) {
    .live-pill:not(.stopped) .dot.live {
      animation: pulse 1.8s ease-in-out infinite;
    }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ── status strip ───────────────────────────────────── */
  /* Health detail from /api/status (Milestone 7). The pill above is the
     one-glance verdict; this row is the "why". */

  .strip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    height: 26px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line-soft);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow-x: auto;
    z-index: 2;
  }

  .chip {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
  }
  .chip-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 0 0 auto;
  }
  /* Something is wrong with this specific signal (MQTT down, channel gone
     stale). Per-signal only -- a stale channel never colours the pill. */
  .chip.warn { color: var(--degraded); }
  /* Signal unavailable rather than bad: metrics off, or no tick yet. */
  .chip.dim { color: var(--ink-faint); }
  /* Fallback so an unrecognised channel id isn't an invisible dot; .dot.rx
     and .dot.tx override this. */
  .chip .dot { background: var(--ink-faint); }
  .chip.warn .dot { background: var(--degraded); }
  .chip .val { color: var(--ink); }
  .chip.dim .val, .chip.warn .val { color: inherit; }

  /* Second strip: one chip per pipeline module. State comes from `workers`
     (always live); latency from `latencies` (last metrics tick, so it can be
     absent while the state is still known). */
  .strip.modules {
    border-bottom: 1px solid var(--line);
    gap: 18px;
  }
  .mod-name { color: inherit; }
  .mod-lat {
    color: var(--ink-faint);
    text-transform: none;
    letter-spacing: 0;
  }
  .chip.running { color: var(--ink-dim); }
  .chip.running .dot { background: var(--live); }
  .chip.restarting, .chip.mod-degraded { color: var(--degraded); }
  .chip.restarting .dot, .chip.mod-degraded .dot { background: var(--degraded); }
  .chip.stopped { color: var(--stopped); }
  .chip.stopped .dot { background: var(--stopped); }

  /* ── feed ───────────────────────────────────────────── */

  .feed {
    flex: 1 1 auto;
    overflow-y: auto;
    z-index: 1;
    padding: 28px 20px 90px;
  }

  .feed-inner {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 100%;
  }

  .empty {
    margin: auto;
    color: var(--ink-faint);
    font-size: 13px;
    letter-spacing: 0.04em;
    text-align: center;
  }
  .empty[hidden] { display: none; }

  .sys-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0 8px;
    color: var(--ink-faint);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .sys-row::before,
  .sys-row::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line-soft);
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 68%;
  }
  .msg.rx { align-self: flex-start; align-items: flex-start; }
  .msg.tx { align-self: flex-end; align-items: flex-end; }

  @media (max-width: 720px) {
    .msg { max-width: 88%; }
  }

  .msg-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .msg-time {
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    text-transform: none;
    letter-spacing: 0;
  }

  .bubble {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 11px 14px;
    font-size: 16.5px;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.rx .bubble { border-left: 2px solid var(--rx); }
  .msg.tx .bubble { border-right: 2px solid var(--tx); }

  .cursor-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding-top: 4px;
    color: var(--ink-faint);
    font-size: 12px;
    letter-spacing: 0.05em;
  }

  .blink {
    color: var(--live);
    font-size: 14px;
    transition: color 0.2s ease;
  }
  .blink.stopped { color: var(--ink-faint); }
  @media (prefers-reduced-motion: no-preference) {
    .blink:not(.stopped) { animation: blink 1s steps(1) infinite; }
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ── jump-to-latest ─────────────────────────────────── */

  .jump {
    position: absolute;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--tx);
    border-radius: var(--radius);
    padding: 8px 14px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 3;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  }
  .jump:hover { background: var(--tx-dim); }
  .jump:focus-visible {
    outline: 2px solid var(--tx);
    outline-offset: 2px;
  }
  .jump[hidden] { display: none; }
</style>
</head>
<body>

<div class="console">
  <header class="bar">
    <div class="ident">
      <span class="ident-name">EDGE-VOICE</span>
      <span class="ident-sub">rpi5 · local session · no network</span>
    </div>
    <div class="legend-group">
      <span class="legend"><span class="dot rx"></span>rx</span>
      <span class="legend"><span class="dot tx"></span>tx</span>
    </div>
    <div class="right">
      <span class="clock" id="clock">--:--:--</span>
      <span class="live-pill stopped" id="livePill"><span class="dot live"></span><span id="liveLabel">connecting</span></span>
    </div>
  </header>

  <div class="strip" id="strip">
    <span class="chip dim" id="chipMqtt"><span class="dot" id="mqttDot"></span>mqtt <span class="val" id="mqttVal">&mdash;</span></span>
    <span class="chip dim" id="chipQueues">q <span class="val" id="queueVal">&mdash;</span></span>
    <span class="chip-group" id="channelChips"></span>
    <span class="chip dim" id="chipMetrics">metrics <span class="val" id="metricsVal">&mdash;</span></span>
  </div>

  <div class="strip modules" id="modules"></div>

  <main class="feed" id="feed">
    <div class="feed-inner" id="feedInner">
      <div class="empty" id="empty">no transcripts yet — waiting for speech</div>
    </div>
  </main>

  <button class="jump" id="jumpBtn" type="button" hidden>&#8595; new lines</button>
</div>

<script>
  (function () {
    var feed = document.getElementById("feed");
    var inner = document.getElementById("feedInner");
    var empty = document.getElementById("empty");
    var jumpBtn = document.getElementById("jumpBtn");
    var clockEl = document.getElementById("clock");
    var livePill = document.getElementById("livePill");
    var liveLabel = document.getElementById("liveLabel");
    var chipMqtt = document.getElementById("chipMqtt");
    var mqttVal = document.getElementById("mqttVal");
    var chipQueues = document.getElementById("chipQueues");
    var queueVal = document.getElementById("queueVal");
    var chipMetrics = document.getElementById("chipMetrics");
    var metricsVal = document.getElementById("metricsVal");
    var channelChips = document.getElementById("channelChips");
    var modulesEl = document.getElementById("modules");
    var chanCache = {};
    var modCache = {};
    var DASH = "—";

    // Pipeline order, with the short label shown on the kiosk and which
    // `latencies` key (if any) belongs to that module. MqttAudioIngest is a
    // source with nothing to time -- it has no latency entry by design.
    var MODULES = [
      { worker: "MqttAudioIngest", label: "ingest", latency: null },
      { worker: "ChannelRouter", label: "router", latency: "router" },
      { worker: "VADWorker", label: "vad", latency: "vad_silero" },
      { worker: "STTWorker", label: "stt", latency: "stt" },
    ];

    var cursorRow = document.createElement("div");
    cursorRow.className = "cursor-row";
    cursorRow.innerHTML = '<span class="blink stopped" id="blink">&#9612;</span><span id="cursorText">connecting…</span>';
    inner.appendChild(cursorRow);
    var blink = document.getElementById("blink");
    var cursorText = document.getElementById("cursorText");

    function isNearBottom() {
      return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 90;
    }

    function scrollToBottom(smooth) {
      feed.scrollTo({ top: feed.scrollHeight, behavior: smooth ? "smooth" : "auto" });
      jumpBtn.hidden = true;
    }

    function formatTime(epochSeconds) {
      var d = new Date(epochSeconds * 1000);
      return d.toLocaleTimeString([], { hour12: false });
    }

    function renderMessage(m) {
      var wrap = document.createElement("div");
      wrap.className = "msg " + m.channel_id;

      var meta = document.createElement("div");
      meta.className = "msg-meta";

      var dot = document.createElement("span");
      dot.className = "dot " + m.channel_id;
      meta.appendChild(dot);

      var tag = document.createElement("span");
      tag.textContent = m.channel_id;
      meta.appendChild(tag);

      var time = document.createElement("span");
      time.className = "msg-time";
      time.textContent = formatTime(m.created_at);
      meta.appendChild(time);

      var bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = m.text;

      wrap.appendChild(meta);
      wrap.appendChild(bubble);
      return wrap;
    }

    function appendMessage(m) {
      empty.hidden = true;
      var wasNearBottom = isNearBottom();
      inner.insertBefore(renderMessage(m), cursorRow);
      if (wasNearBottom) {
        scrollToBottom(true);
      } else {
        jumpBtn.hidden = false;
      }
    }

    jumpBtn.addEventListener("click", function () {
      scrollToBottom(true);
    });

    feed.addEventListener("scroll", function () {
      if (isNearBottom()) jumpBtn.hidden = true;
    });

    // ── live wall clock ───────────────────────────────────

    function tickClock() {
      clockEl.textContent = new Date().toLocaleTimeString([], { hour12: false });
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ── transcript stream (SSE) ────────────────────────────
    // EventSource reconnects on its own; nothing to manage here beyond
    // rendering what arrives. Whether the *pipeline* is running is a
    // separate question, answered by /api/status below -- the SSE
    // connection itself stays open as long as the (same-process) server
    // does, regardless of whether the pipeline is started or stopped.

    var source = new EventSource("/api/transcripts/stream");
    source.onmessage = function (e) {
      appendMessage(JSON.parse(e.data));
    };

    // ── pipeline status poll ───────────────────────────────

    // Chip helper: set text + which of warn/dim (if either) applies.
    function setChip(chip, valEl, text, state) {
      valEl.textContent = text;
      chip.classList.toggle("warn", state === "warn");
      chip.classList.toggle("dim", state === "dim");
    }

    // Freshness reads as seconds since the last packet on that channel.
    // Clamped at 0 because the router's clock is wall-clock (time.time()),
    // so a clock step could otherwise render a negative age.
    function formatAge(seconds) {
      if (seconds === null || seconds === undefined) return DASH;
      var s = Math.max(0, seconds);
      return s < 10 ? s.toFixed(1) + "s" : Math.round(s) + "s";
    }

    function renderChannels(channels) {
      if (!channels) {
        for (var cached in chanCache) {
          setChip(chanCache[cached].chip, chanCache[cached].val, DASH, "dim");
        }
        return;
      }
      // Built from the payload rather than hardcoded rx/tx: the channel set
      // is config-driven, so hardcoding would contradict the server.
      for (var id in channels) {
        var entry = chanCache[id];
        if (!entry) {
          var chip = document.createElement("span");
          chip.className = "chip";
          chip.innerHTML = '<span class="dot ' + id + '"></span>' + id + ' <span class="val"></span>';
          channelChips.appendChild(chip);
          entry = chanCache[id] = { chip: chip, val: chip.querySelector(".val") };
        }
        var info = channels[id] || {};
        var seen = info.freshness_s !== null && info.freshness_s !== undefined;
        setChip(entry.chip, entry.val, formatAge(info.freshness_s), info.stale ? "warn" : seen ? null : "dim");
      }
    }

    // Latency spans microseconds (router repacketize) to hundreds of
    // milliseconds (STT inference), so fixed units would render most stages
    // as 0. Scale per value instead.
    function formatLatency(seconds) {
      if (seconds === null || seconds === undefined) return DASH;
      if (seconds < 0.001) return Math.round(seconds * 1e6) + "µs";
      if (seconds < 1) return (seconds * 1000).toFixed(seconds < 0.01 ? 2 : 0) + "ms";
      return seconds.toFixed(2) + "s";
    }

    // One number per module on a kiosk this size, so show the slowest
    // channel: it's the one that would breach a latency budget first.
    function worstLatency(byChannel) {
      if (!byChannel) return null;
      var worst = null;
      for (var id in byChannel) {
        if (worst === null || byChannel[id] > worst) worst = byChannel[id];
      }
      return worst;
    }

    function renderModules(data) {
      var workers = data.workers || {};
      var latencies = data.latencies;
      for (var i = 0; i < MODULES.length; i++) {
        var mod = MODULES[i];
        var entry = modCache[mod.worker];
        if (!entry) {
          var chip = document.createElement("span");
          chip.className = "chip";
          chip.innerHTML =
            '<span class="dot"></span><span class="mod-name">' + mod.label +
            '</span><span class="mod-lat"></span>';
          modulesEl.appendChild(chip);
          entry = modCache[mod.worker] = { chip: chip, lat: chip.querySelector(".mod-lat") };
        }
        // State is always live, even when the metrics tick hasn't landed.
        var state = workers[mod.worker] || null;
        entry.chip.classList.toggle("running", state === "running");
        entry.chip.classList.toggle("restarting", state === "restarting");
        entry.chip.classList.toggle("mod-degraded", state === "degraded");
        entry.chip.classList.toggle("stopped", state === "stopped");
        entry.chip.classList.toggle("dim", !state);
        // Latency is snapshot-derived, so it can be absent while state isn't.
        entry.lat.textContent = mod.latency && latencies
          ? " " + formatLatency(worstLatency(latencies[mod.latency]))
          : "";
      }
    }

    function renderStrip(data) {
      var mqtt = data.mqtt_connected;
      setChip(chipMqtt, mqttVal,
        mqtt === true ? "ok" : mqtt === false ? "down" : DASH,
        mqtt === false ? "warn" : mqtt === true ? null : "dim");

      var depths = data.queue_depths;
      var parts = [];
      for (var name in depths || {}) parts.push(name + ":" + depths[name]);
      setChip(chipQueues, queueVal, parts.length ? parts.join(" ") : DASH, parts.length ? null : "dim");

      var metrics = data.metrics || {};
      var ok = metrics.state === "ok";
      setChip(chipMetrics, metricsVal,
        metrics.state === "disabled" ? "off"
          : metrics.state === "pending" ? "waiting"
          : ok ? formatAge(metrics.age_s) + " ago" : DASH,
        ok ? null : "dim");

      renderChannels(data.channels);
      renderModules(data);
    }

    // Three states, not two: a warning pipeline is still running (some
    // workers healthy) but a worker has crash-looped past its restart budget,
    // or MQTT is unreachable -- so it must read distinctly from both "live"
    // and "stopped". Keyed off the server's `status` verdict, with a
    // `running` fallback for the fetch-failure payload below.
    function setStatus(data) {
      var verdict = data.status || (data.running ? "ok" : "down");
      var stopped = verdict === "down";
      var warn = verdict === "warn";
      livePill.classList.toggle("stopped", stopped);
      livePill.classList.toggle("degraded", warn);
      blink.classList.toggle("stopped", stopped);

      var mqttDown = data.mqtt_connected === false;
      liveLabel.textContent = stopped
        ? "stopped"
        : data.degraded
        ? "degraded"
        : mqttDown
        ? "mqtt down"
        : "live";
      cursorText.textContent = stopped
        ? "pipeline stopped"
        : data.degraded
        ? "running — worker degraded"
        : mqttDown
        ? "running — mqtt disconnected"
        : "waiting for next line";

      renderStrip(data);
    }

    function pollStatus() {
      fetch("/api/status")
        .then(function (r) { return r.json(); })
        .then(function (data) { setStatus(data); })
        // No payload to render on a failed poll: blank the strip rather than
        // leaving stale values that look current.
        .catch(function () { setStatus({ running: false }); });
    }
    pollStatus();
    setInterval(pollStatus, 3000);
  })();
</script>

</body>
</html>
